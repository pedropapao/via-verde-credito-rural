services:
  - type: web
    name: via-verde-credito-rural
    runtime: go
    plan: free
    buildCommand: cp bin/via-verde-amd64 bin/via-verde && chmod +x bin/via-verde
    startCommand: ./bin/via-verde
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_BASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: via-verde-files
      - key: ADMIN_NAME
        value: Pedro Massoli
      - key: ADMIN_USERNAME
        value: pedro.massoli
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_DAYS
        value: 14
