name: Via Verde CAR Desktop Windows

on:
  push:
    branches: [desktop-v1-car-current]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-windows.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test-and-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Identificar versão
        shell: pwsh
        run: |
          $content = Get-Content app.go -Raw
          if ($content -notmatch 'const AppVersion = "([^"]+)"') {
            throw "AppVersion não localizado em app.go"
          }
          "APP_VERSION=$($Matches[1])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Baixar dependências
        run: go mod tidy

      - name: Testes
        run: go test ./...

      - name: Instalar Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Compilar EXE
        run: wails build -platform windows/amd64 -clean -webview2 download -o ViaVerdeCAR.exe

      - name: Publicar EXE como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ViaVerdeCAR-${{ env.APP_VERSION }}-Windows
          path: desktop/build/bin/ViaVerdeCAR.exe
          if-no-files-found: error

      - name: Publicar canal de atualização automática
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          UPDATE_ENDPOINT: https://igrxqbroklfwujcwbiwh.supabase.co/functions/v1/via-verde-desktop-update
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = "build/bin/ViaVerdeCAR.exe"
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $exe).Length
          $notes = (Get-Content "UPDATE_NOTES.txt" -Raw).Trim()
          $notes64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($notes))

          $commonHeaders = @(
            "--header", "Authorization: Bearer $env:GITHUB_API_TOKEN",
            "--header", "x-github-run-id: $env:GITHUB_RUN_ID",
            "--header", "x-github-sha: $env:GITHUB_SHA",
            "--header", "x-version: $env:APP_VERSION",
            "--header", "x-sha256: $sha",
            "--header", "x-size: $size"
          )

          $prepareUrl = $env:UPDATE_ENDPOINT + "?action=prepare"
          $prepareResponse = Join-Path $env:RUNNER_TEMP "viaverde-prepare.json"
          $prepareArgs = @(
            "--fail-with-body",
            "--silent",
            "--show-error",
            "--retry", "3",
            "--retry-delay", "2",
            "--request", "POST",
            $prepareUrl,
            "--output", $prepareResponse
          ) + $commonHeaders
          & curl.exe @prepareArgs
          if ($LASTEXITCODE -ne 0) { throw "Falha ao preparar upload da atualização" }
          $prepare = (Get-Content $prepareResponse -Raw) | ConvertFrom-Json
          if (-not $prepare.upload_url) { throw "URL assinada de upload não retornada" }

          $uploadArgs = @(
            "--fail-with-body",
            "--silent",
            "--show-error",
            "--retry", "3",
            "--retry-delay", "2",
            "--request", "PUT",
            $prepare.upload_url,
            "--header", "content-type: application/vnd.microsoft.portable-executable",
            "--header", "cache-control: max-age=3600",
            "--header", "x-upsert: true",
            "--data-binary", "@$exe",
            "--output", "NUL"
          )
          & curl.exe @uploadArgs
          if ($LASTEXITCODE -ne 0) { throw "Falha ao enviar EXE para o Storage" }

          $finalizeUrl = $env:UPDATE_ENDPOINT + "?action=finalize"
          $finalizeResponse = Join-Path $env:RUNNER_TEMP "viaverde-finalize.json"
          $finalizeArgs = @(
            "--fail-with-body",
            "--silent",
            "--show-error",
            "--retry", "3",
            "--retry-delay", "2",
            "--request", "POST",
            $finalizeUrl,
            "--header", "x-notes-base64: $notes64",
            "--output", $finalizeResponse
          ) + $commonHeaders
          & curl.exe @finalizeArgs
          if ($LASTEXITCODE -ne 0) { throw "Falha ao finalizar publicação da atualização" }
          $finalize = (Get-Content $finalizeResponse -Raw) | ConvertFrom-Json
          if (-not $finalize.ok) { throw "Publicação não confirmada pelo servidor" }
