name: Via Verde CAR Desktop Windows

on:
  push:
    branches: [desktop-v1-car]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-windows.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Baixar dependências
        run: go mod tidy
      - name: Testes
        run: go test ./...
      - name: Instalar Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Compilar EXE
        run: wails build -platform windows/amd64 -clean -webview2 download -o ViaVerdeCAR.exe
      - name: Publicar EXE
        uses: actions/upload-artifact@v4
        with:
          name: ViaVerdeCAR-1.0.0-Windows
          path: desktop/build/bin/ViaVerdeCAR.exe
          if-no-files-found: error
