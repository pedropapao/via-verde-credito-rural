{{define "content"}}
<div class="two-col"><section class="card profile-card"><div class="avatar large">{{slice .User.Name 0 1}}</div><div><span class="eyebrow">PERFIL</span><h2>{{.User.Name}}</h2><p>@{{.User.Username}}</p><span class="badge ok">{{roleLabel .User.Role}}</span></div></section><section class="card"><div class="section-head"><div><span class="eyebrow">SEGURANÇA</span><h3>Alterar senha</h3></div></div><form method="post" action="/settings/password" class="stack-form"><input type="hidden" name="csrf" value="{{.CSRF}}"><label>Senha atual<input type="password" name="current_password" required></label><label>Nova senha<input type="password" name="new_password" required minlength="10"></label><label>Confirmar nova senha<input type="password" name="confirm_password" required minlength="10"></label><button class="btn primary" type="submit">Alterar senha</button></form></section></div>
{{end}}
