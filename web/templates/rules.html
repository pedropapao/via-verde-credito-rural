{{define "content"}}
{{with .Data}}
<section class="card whatsapp-report-card">
  <div class="whatsapp-report-top">
    <div>
      <span class="eyebrow">RELATÓRIO DO DIA</span>
      <h2>Pronto para mandar no WhatsApp</h2>
      <p>Escolha a data, ajuste o texto se quiser e clique em copiar.</p>
    </div>
    <form method="get" action="/reports/summary" class="date-filter whatsapp-date-filter">
      <label>Data<input type="date" name="date" value="{{.Date}}"></label>
      <button class="btn ghost" type="submit">Ver dia</button>
    </form>
  </div>

  <textarea id="daily-summary-whatsapp" class="whatsapp-report-textarea">📋 RELATÓRIO DO DIA — {{dateBR .Date}}
{{if .ProjectSummaries}}{{range .ProjectSummaries}}
✅ {{.Producer}}{{if .Project.Bank}} — {{.Project.Bank}}{{end}}
{{if ge (len .Activities) 2}}{{range slice .Activities 0 2}}• {{.}}
{{end}}{{else}}{{range .Activities}}• {{.}}
{{end}}{{end}}📍 {{if .Project.Status}}{{.Project.Status}}{{else}}Status a confirmar{{end}} · {{.Dependency}}
{{end}}{{if .PendingNext}}
⚠️ PENDÊNCIAS
{{range .PendingNext}}• {{.Producer}} — {{.Text}}
{{end}}{{end}}{{else}}
Sem movimentações registradas neste dia.{{end}}</textarea>

  <button class="btn primary whatsapp-copy-button" type="button" data-copy-target="#daily-summary-whatsapp">Copiar para WhatsApp</button>
  <small class="whatsapp-edit-note">O texto acima é editável. O que você mudar ali não altera os projetos.</small>
</section>
{{end}}
{{end}}
